
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maggie</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  min-height:100svh;
  padding:20px;
  box-sizing:border-box;
}

.card{
  background:#050b16;
  border:1.5px solid #142438;
  padding:26px 24px 30px;
  border-radius:40px;
  width:100%;
  max-width:420px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* Paw decoration */

.paw-divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  width:75%;
  color:#b7d44b;
  margin-bottom:10px;
}

.paw-divider::before,
.paw-divider::after{
  content:"";
  flex:1;
  height:3px;
  background:#b7d44b;
  border-radius:100%;
}

.paw-icon{
  width:30px;
  height:30px;
  fill:currentColor;
  flex-shrink:0;
}

/* Maggie heading */

h1{
  font-family:'Kalam', cursive;
  font-size:clamp(25px, 7vw, 36px);
  font-weight:700;
  line-height:1.3;
  margin:0;
  color:white;
  position:relative;
  z-index:3;
}

/* Original Maggie illustration */

.maggie-wrap{
  position:relative;
  width:300px;
  max-width:100%;
  aspect-ratio:300 / 330;
  flex-shrink:0;
  margin:-30px 0 -48px;
}

.maggie-body{
  position:absolute;
  width:80%;
  left:50%;
  top:0;
  transform:translateX(-50%);
  z-index:2;
}

/* Maggie's original wagging tail */

.maggie-tail{
  position:absolute;
  width:26%;
  max-width:none;
  left:54%;
  top:50%;
  transform-origin:left center;

  transform:
    scaleX(1.45)
    rotate(12deg);

  animation:wag .6s infinite ease-in-out;

  filter:drop-shadow(0 0 1px rgba(0,0,0,.4));

  opacity:1;
  z-index:1;
}

@keyframes wag{
  0%{transform:rotate(-18deg);}
  50%{transform:rotate(18deg);}
  100%{transform:rotate(-18deg);}
}

/* Maggie's tagline */

.subtitle{
  font-family:'Kalam', cursive;
  font-size:clamp(22px, 6vw, 30px);
  font-weight:700;
  color:#b7d44b;
  line-height:1.3;
  margin:0;
  position:relative;
  z-index:3;
}

/* Heart decoration */

.heart-divider{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  width:65%;
  color:#b7d44b;
  margin:0 0 25px;
}

.heart-divider::before,
.heart-divider::after{
  content:"";
  flex:1;
  height:3px;
  background:#b7d44b;
  border-radius:100%;
}

.heart-icon{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.5;
  flex-shrink:0;
}

/* Navigation buttons */

.button{
  display:block;
  width:100%;
  padding:17px;
  border-radius:22px;
  font-size:18px;
  font-weight:bold;
  text-decoration:none;
  margin-bottom:14px;
  box-sizing:border-box;
  transition:transform .2s ease,
             box-shadow .2s ease,
             filter .2s ease;
}

.button:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(0,0,0,.3);
  filter:brightness(1.07);
}

.button:active{
  transform:scale(.97);
}

.primary{
  background:#b7d44b;
  color:black;
}

.secondary{
  background:#e6e6e6;
  color:black;
  margin-bottom:0;
}

/* Mobile layout */

@media (max-width:480px){

  body{
    padding:18px;
  }

  .card{
    padding:24px 20px 26px;
    border-radius:32px;
  }

  .button{
    font-size:17px;
    padding:16px;
  }

}

</style>
</head>

<body>

<div class="card">

  <!-- Decorative paw print -->

  <div class="paw-divider" aria-hidden="true">

    <svg class="paw-icon" viewBox="0 0 100 100">
      <ellipse cx="19" cy="38" rx="11" ry="15"
        transform="rotate(-25 19 38)"/>
      <ellipse cx="39" cy="22" rx="11" ry="16"
        transform="rotate(-10 39 22)"/>
      <ellipse cx="64" cy="22" rx="11" ry="16"
        transform="rotate(10 64 22)"/>
      <ellipse cx="83" cy="39" rx="11" ry="15"
        transform="rotate(25 83 39)"/>
      <path d="M50 43
               C36 43 34 55 23 67
               C10 85 30 96 44 88
               Q50 84 56 88
               C72 96 91 85 77 67
               C66 55 64 43 50 43Z"/>
    </svg>

  </div>

  <h1>Hi, I'm Maggie!</h1>

  <!-- Original animated Maggie -->

  <div class="maggie-wrap">

    <img src="maggie-tail.png"
         class="maggie-tail"
         alt="">

    <img src="maggie-body.png"
         class="maggie-body"
         alt="Maggie the dog">

  </div>

  <p class="subtitle">I'm the cute one!</p>

  <!-- Decorative heart -->

  <div class="heart-divider" aria-hidden="true">

    <svg class="heart-icon" viewBox="0 0 24 24">
      <path d="M20.8 4.6
               C18.5 2.3 14.8 3 12 6
               C9.2 3 5.5 2.3 3.2 4.6
               C-1 9 5 15 12 21
               C19 15 25 9 20.8 4.6Z"/>
    </svg>

  </div>

  <!-- Original navigation -->

  <a href="index.html" class="button primary">
    🚁 Meet My Pilot
  </a>

  <a href="https://instagram.com/maggie.sox"
     target="_blank"
     rel="noopener noreferrer"
     class="button secondary">
    🐶 See More Maggie
  </a>

</div>

</body>
</html>
